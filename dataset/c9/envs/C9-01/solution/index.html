<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮玩小店 · 店员工作台</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --line:#e3e6ee; --text:#1f2430; --muted:#6b7280; --pri:#5b5bd6; --pri2:#4747c2;
          --ok:#16a34a; --warn:#d97706; --danger:#dc2626; --info:#0284c7; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:#262a4a; color:#fff; }
  header h1 { font-size:18px; margin:0; }
  header .member { margin-left:auto; display:flex; align-items:center; gap:8px; }
  nav { display:flex; gap:4px; padding:8px 20px 0; background:#262a4a; }
  nav button { background:transparent; border:0; color:#c7c9e8; padding:8px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-size:14px; }
  nav button.active { background:var(--bg); color:var(--text); font-weight:600; }
  main { padding:16px 20px 40px; }
  .tab { display:none; } .tab.active { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .two { display:grid; grid-template-columns:2fr 1fr; gap:14px; } @media (max-width:900px){ .two{grid-template-columns:1fr;} }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button.btn { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.btn.pri { background:var(--pri); border-color:var(--pri); color:#fff; } button.btn.pri:hover { background:var(--pri2); }
  button.btn.danger { color:var(--danger); border-color:#f3c3c3; } button.btn.danger:hover { background:#fff1f1; }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  .money { font-variant-numeric:tabular-nums; } .right { text-align:right; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid; }
  .st-pending { color:var(--warn); border-color:#f5d6a8; background:#fff8ec; } .st-paid { color:var(--info); border-color:#b6dcf0; background:#eef8fd; }
  .st-shipped { color:var(--ok); border-color:#b9e3c6; background:#effaf2; } .st-cancelled { color:var(--muted); border-color:#d6d9e0; background:#f3f4f6; }
  .st-refund { color:#9333ea; border-color:#ddc4f5; background:#f8f1fe; }
  .stock0 { color:var(--danger); } .stocklow { color:var(--warn); }
  .breakdown div { display:flex; justify-content:space-between; padding:2px 0; } .breakdown .total { font-weight:700; font-size:16px; border-top:1px dashed var(--line); margin-top:6px; padding-top:6px; }
  .rules { background:#f7f7ff; border:1px dashed #c9c9f3; border-radius:8px; padding:8px 10px; font-size:13px; }
  #toast { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:50; }
  .toast { padding:10px 14px; border-radius:8px; color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.15); max-width:420px; }
  .toast.ok { background:var(--ok); } .toast.err { background:var(--danger); } .toast.info { background:#374151; }
  .stat { font-size:22px; font-weight:700; } .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; } @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr);}}
  dialog { border:1px solid var(--line); border-radius:12px; padding:18px; min-width:420px; max-width:640px; }
  dialog::backdrop { background:rgba(15,18,40,.35); }
  .err-text { color:var(--danger); font-size:12px; min-height:16px; }
  details summary { cursor:pointer; color:var(--pri); }
</style>
</head>
<body>
<header>
  <h1>🧸 潮玩小店 · 店员工作台</h1>
  <span class="small muted" style="color:#c7c9e8">本地模拟收付款 · 数据保存在本浏览器</span>
  <label class="member"><input type="checkbox" id="memberToggle"> 当前顾客为会员（<span id="memberRateText"></span>）</label>
</header>
<nav id="nav">
  <button data-tab="shop" class="active">商品与购物车</button>
  <button data-tab="orders">订单管理</button>
  <button data-tab="aftersale">售后处理</button>
  <button data-tab="stats">查询统计</button>
  <button data-tab="data">数据与日志</button>
</nav>
<main>
  <!-- 商品与购物车 -->
  <section class="tab active" id="tab-shop">
    <div class="two">
      <div>
        <div class="card">
          <div class="row">
            <input id="q" placeholder="搜索商品名称 / 规格 / SKU" style="flex:1;min-width:200px">
            <select id="fCat"><option value="">全部分类</option></select>
            <select id="fStock"><option value="">全部库存</option><option value="in">有货</option><option value="out">缺货</option></select>
            <select id="fPrice"><option value="">全部价格</option><option value="0-100">¥100 以下</option><option value="100-300">¥100–300</option><option value="300-">¥300 以上</option></select>
          </div>
        </div>
        <div class="grid" id="productGrid"></div>
      </div>
      <div>
        <div class="card">
          <h2>🛒 购物车</h2>
          <div id="cartBox"></div>
        </div>
        <div class="card">
          <h2>优惠</h2>
          <div class="row"><select id="couponSel" style="flex:1"></select></div>
          <div class="rules" style="margin-top:8px" id="ruleBox"></div>
        </div>
        <div class="card">
          <h2>金额明细</h2>
          <div class="breakdown" id="amountBox"></div>
          <div style="margin-top:10px"><button class="btn pri" id="toCheckout" style="width:100%">去结算</button></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 订单 -->
  <section class="tab" id="tab-orders">
    <div class="card">
      <div class="row">
        <input id="oq" placeholder="订单号">
        <input id="osku" placeholder="商品名 / SKU">
        <select id="ost"><option value="">全部状态</option><option value="pending">待付款</option><option value="paid">已付款</option><option value="shipped">已发货</option><option value="cancelled">已取消</option></select>
        <label class="small muted">从 <input type="date" id="ofrom"></label>
        <label class="small muted">至 <input type="date" id="oto"></label>
        <button class="btn" id="oclear">清空筛选</button>
      </div>
    </div>
    <div class="card"><table><thead><tr><th>订单号</th><th>下单时间</th><th>收货人</th><th>商品</th><th class="right">实付</th><th class="right">已退</th><th>状态</th><th>操作</th></tr></thead><tbody id="orderRows"></tbody></table></div>
  </section>

  <!-- 售后 -->
  <section class="tab" id="tab-aftersale">
    <div class="card">
      <h2>售后单</h2>
      <p class="small muted">已发货订单的退货：退款在申请时按实付分摊计算并记录；货物需"确认退货入库"后才回补库存（每单只能入库一次）。未发货订单的部分退款会立即释放对应库存。</p>
      <table><thead><tr><th>售后单号</th><th>订单号</th><th>时间</th><th>商品</th><th class="right">退款金额</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody id="refundRows"></tbody></table>
    </div>
  </section>

  <!-- 统计 -->
  <section class="tab" id="tab-stats">
    <div class="stats" id="statCards"></div>
    <div class="card" style="margin-top:14px"><h2>商品销量（已付款订单数量 − 已退数量）</h2><table><thead><tr><th>SKU</th><th>商品 / 规格</th><th class="right">销量</th><th class="right">当前库存</th></tr></thead><tbody id="salesRows"></tbody></table></div>
  </section>

  <!-- 数据与日志 -->
  <section class="tab" id="tab-data">
    <div class="card">
      <h2>备份与恢复</h2>
      <div class="row">
        <button class="btn pri" id="btnExport">导出完整业务数据 (JSON)</button>
        <label class="btn">导入备份文件<input type="file" id="importFile" accept=".json,application/json" hidden></label>
        <button class="btn danger" id="btnReset">恢复演示初始数据</button>
      </div>
      <p class="small muted">导入前会完整校验文件；校验失败不会覆盖现有数据。</p>
    </div>
    <div class="card"><h2>操作记录</h2><table><thead><tr><th>时间</th><th>操作</th><th>详情</th></tr></thead><tbody id="logRows"></tbody></table></div>
  </section>
</main>

<dialog id="checkoutDlg">
  <h2 style="margin-top:0">结算 · 填写收货信息</h2>
  <div id="checkoutStep1">
    <div style="display:grid;gap:8px">
      <label>收货人 <input id="addrName" style="width:100%"></label><div class="err-text" id="eName"></div>
      <label>手机号 <input id="addrPhone" style="width:100%" placeholder="11 位手机号"></label><div class="err-text" id="ePhone"></div>
      <label>收货地址 <textarea id="addrAddr" rows="2" style="width:100%"></textarea></label><div class="err-text" id="eAddr"></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-close>取消</button><button class="btn pri" id="toConfirm">下一步：确认金额</button></div>
  </div>
  <div id="checkoutStep2" hidden>
    <div id="confirmSummary"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="backToStep1">返回修改</button><button class="btn pri" data-testid="confirm-order" id="confirmOrder">确认下单（占用库存）</button></div>
  </div>
</dialog>

<dialog id="refundDlg">
  <h2 style="margin-top:0">申请售后 · <span id="rfOrderId"></span></h2>
  <div id="rfBody"></div>
  <label class="row" style="margin-top:8px"><input type="checkbox" id="rfReturn" checked> 需要退货（已发货订单：确认收到退货后才回补库存）</label>
  <div class="breakdown" id="rfPreview" style="margin-top:8px"></div>
  <div class="err-text" id="rfErr"></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-close>取消</button><button class="btn pri" id="rfSubmit">提交售后并退款</button></div>
</dialog>

<div id="toast"></div>

<script>
(function () {
"use strict";
const STORE_KEY = "toyshop-workbench-v1";
const STATUS = { pending: "待付款", paid: "已付款", shipped: "已发货", cancelled: "已取消" };
const yuan = c => (c / 100);
const fmt = c => "¥" + (c / 100).toFixed(2);
const toCents = y => Math.round(Number(y) * 100);
const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

// ---------- seed data (prices in cents) ----------
function seed() {
  const products = [
    { id: "P01", name: "星星熊系列盲盒", category: "盲盒", variants: [
      { sku: "P01-S", spec: "单盒", price: 5900, stock: 40 }, { sku: "P01-B", spec: "整盒 12 个", price: 64800, stock: 5 } ] },
    { id: "P02", name: "机甲战士 合金手办", category: "手办", variants: [
      { sku: "P02-STD", spec: "标准版", price: 29900, stock: 8 }, { sku: "P02-LTD", spec: "限定版", price: 49900, stock: 0 } ] },
    { id: "P03", name: "萌宠毛绒挂件", category: "毛绒", variants: [
      { sku: "P03-S", spec: "小号 10cm", price: 3900, stock: 100 }, { sku: "P03-L", spec: "大号 20cm", price: 6900, stock: 30 } ] },
    { id: "P04", name: "像素积木 · 城市街景", category: "积木", variants: [ { sku: "P04-1", spec: "基础款", price: 19900, stock: 15 } ] },
    { id: "P05", name: "动漫角色亚克力立牌", category: "周边", variants: [
      { sku: "P05-A", spec: "A 款", price: 2900, stock: 60 }, { sku: "P05-B", spec: "B 款", price: 2900, stock: 2 } ] },
    { id: "P06", name: "迷你复古扭蛋机", category: "周边", variants: [
      { sku: "P06-R", spec: "红色", price: 15900, stock: 6 }, { sku: "P06-U", spec: "蓝色", price: 15900, stock: 4 } ] },
  ];
  const coupons = [
    { code: "M300-30", name: "满 300 减 30", threshold: 30000, amount: 3000 },
    { code: "M800-100", name: "满 800 减 100", threshold: 80000, amount: 10000 },
  ];
  const addr = { name: "林小可", phone: "13800138000", address: "上海市徐汇区漕溪北路 88 号" };
  const mk = (id, daysAgo, status, items, opts) => {
    const t = new Date(Date.now() - daysAgo * 86400000).toISOString();
    const subtotal = items.reduce((s, i) => s + i.unitPrice * i.qty, 0);
    const memberDiscount = opts.member ? Math.round(subtotal * 0.05) : 0;
    const couponDiscount = opts.coupon || 0;
    const o = { id, createdAt: t, status, address: opts.addr || addr, items, subtotal, member: !!opts.member,
      discounts: [], payable: subtotal - memberDiscount - couponDiscount, paidAt: null, shippedAt: null, cancelledAt: null, refunds: [] };
    if (memberDiscount) o.discounts.push({ type: "member", label: "会员 95 折", amount: memberDiscount });
    if (couponDiscount) o.discounts.push({ type: "coupon", label: opts.couponLabel, code: opts.couponCode, amount: couponDiscount });
    if (["paid", "shipped"].includes(status) || opts.paid) o.paidAt = t;
    if (status === "shipped") o.shippedAt = t;
    if (status === "cancelled") o.cancelledAt = t;
    return o;
  };
  const orders = [
    mk("TS20261001001", 14, "shipped", [{ sku: "P01-S", name: "星星熊系列盲盒", spec: "单盒", qty: 4, unitPrice: 5900 }, { sku: "P04-1", name: "像素积木 · 城市街景", spec: "基础款", qty: 1, unitPrice: 19900 }],
      { coupon: 3000, couponCode: "M300-30", couponLabel: "满 300 减 30" }),
    mk("TS20261003002", 12, "cancelled", [{ sku: "P02-STD", name: "机甲战士 合金手办", spec: "标准版", qty: 1, unitPrice: 29900 }], { addr: { name: "陈一", phone: "13912345678", address: "杭州市西湖区文三路 100 号" } }),
    mk("TS20261005003", 9, "shipped", [{ sku: "P03-L", name: "萌宠毛绒挂件", spec: "大号 20cm", qty: 2, unitPrice: 6900 }, { sku: "P05-A", name: "动漫角色亚克力立牌", spec: "A 款", qty: 3, unitPrice: 2900 }], { member: true }),
    mk("TS20261008004", 6, "paid", [{ sku: "P06-R", name: "迷你复古扭蛋机", spec: "红色", qty: 1, unitPrice: 15900 }], {}),
    mk("TS20261010005", 3, "pending", [{ sku: "P01-B", name: "星星熊系列盲盒", spec: "整盒 12 个", qty: 1, unitPrice: 64800 }], { member: true, addr: { name: "王大锤", phone: "13700001111", address: "北京市朝阳区建国路 1 号" } }),
    mk("TS20261012006", 1, "shipped", [{ sku: "P02-STD", name: "机甲战士 合金手办", spec: "标准版", qty: 1, unitPrice: 29900 }, { sku: "P03-S", name: "萌宠毛绒挂件", spec: "小号 10cm", qty: 5, unitPrice: 3900 }],
      { coupon: 3000, couponCode: "M300-30", couponLabel: "满 300 减 30" }),
  ];
  // historical partial refund on order 003: returned 1 x P05-A (received & restocked)
  const o3 = orders[2];
  o3.refunds.push({ id: "RF20261006001", createdAt: new Date(Date.now() - 8 * 86400000).toISOString(), items: [{ sku: "P05-A", qty: 1 }],
    amount: allocRefund(o3, [{ sku: "P05-A", qty: 1 }]), returnGoods: true, restocked: true, restockedAt: new Date(Date.now() - 7 * 86400000).toISOString() });
  // historical refund on order 006, goods on the way back (not restocked yet)
  const o6 = orders[5];
  o6.refunds.push({ id: "RF20261013002", createdAt: new Date(Date.now() - 0.5 * 86400000).toISOString(), items: [{ sku: "P03-S", qty: 2 }],
    amount: allocRefund(o6, [{ sku: "P03-S", qty: 2 }]), returnGoods: true, restocked: false, restockedAt: null });
  const logs = [{ time: nowIso(), action: "初始化", detail: "载入演示商品与历史订单" }];
  return { version: 1, products, coupons, memberRate: 0.95, orders, logs, seq: { order: 6, refund: 2 } };
}

// ---------- refund allocation: unit share of the paid amount, pro rata to line value ----------
function refundedQty(order, sku) { return order.refunds.reduce((s, r) => s + r.items.filter(i => i.sku === sku).reduce((a, i) => a + i.qty, 0), 0); }
function refundedAmount(order) { return order.refunds.reduce((s, r) => s + r.amount, 0); }
function allocRefund(order, items) {
  const left = order.payable - refundedAmount(order);
  const allLeft = order.items.every(li => {
    const req = items.filter(i => i.sku === li.sku).reduce((a, i) => a + i.qty, 0);
    return req === li.qty - refundedQty(order, li.sku);
  });
  if (allLeft) return left; // last refund returns exactly what is left of the paid amount
  let amt = 0;
  for (const it of items) {
    const li = order.items.find(x => x.sku === it.sku);
    amt += li.unitPrice * it.qty * order.payable / order.subtotal;
  }
  return Math.min(Math.round(amt), left);
}

// ---------- state ----------
let S = load();
let cart = [];            // [{sku, qty}]
let couponCode = "";       // selected coupon
let isMember = false;
let pendingCheckout = null; // {token, address}
let usedTokens = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); const err = validate(d); if (!err) return d; }
  } catch (e) { /* fall through */ }
  const d = seed(); persist(d); return d;
}
function persist(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d || S)); }
function log(action, detail) { S.logs.unshift({ time: nowIso(), action, detail }); }
function commit(action, detail) { if (action) log(action, detail); persist(); renderAll(); }

function findVariant(sku) {
  for (const p of S.products) for (const v of p.variants) if (v.sku === sku) return { p, v };
  return null;
}
function isPosInt(q) { return typeof q === "number" ? Number.isInteger(q) && q > 0 : /^\d+$/.test(String(q)) && Number(q) > 0; }

// ---------- pricing ----------
function priceCart(lines, member, code) {
  const out = { lines: [], subtotal: 0, discounts: [], total: 0, couponStatus: "" };
  for (const l of lines) {
    const fv = findVariant(l.sku); if (!fv) continue;
    const lineTotal = fv.v.price * l.qty;
    out.lines.push({ sku: l.sku, name: fv.p.name, spec: fv.v.spec, qty: l.qty, unitPrice: fv.v.price, lineTotal, stock: fv.v.stock });
    out.subtotal += lineTotal;
  }
  let after = out.subtotal;
  if (member && out.subtotal > 0) {
    const d = out.subtotal - Math.round(out.subtotal * S.memberRate);
    if (d > 0) { out.discounts.push({ type: "member", label: "会员 " + (S.memberRate * 10).toFixed(1).replace(/\.0$/, "") + " 折", amount: d }); after -= d; }
  }
  if (code) {
    const c = S.coupons.find(x => x.code === code);
    if (c && out.subtotal >= c.threshold) {
      const d = Math.min(c.amount, after);
      out.discounts.push({ type: "coupon", label: c.name, code: c.code, amount: d }); after -= d; out.couponStatus = "ok";
    } else if (c) out.couponStatus = "未满足门槛：商品原价合计需满 " + fmt(c.threshold) + "（当前 " + fmt(out.subtotal) + "），优惠已移除";
  }
  out.total = Math.max(0, after);
  return out;
}

// ---------- cart ops ----------
function addToCart(sku, qty) {
  const fv = findVariant(sku);
  if (!fv) return { ok: false, error: "规格不存在" };
  if (!isPosInt(qty)) return { ok: false, error: "数量必须是正整数" };
  qty = Number(qty);
  if (fv.v.stock <= 0) return { ok: false, error: "该规格已售罄" };
  const line = cart.find(l => l.sku === sku);
  const newQty = (line ? line.qty : 0) + qty;
  if (newQty > fv.v.stock) return { ok: false, error: "超出库存（剩余 " + fv.v.stock + " 件，购物车已有 " + (line ? line.qty : 0) + " 件）" };
  if (line) line.qty = newQty; else cart.push({ sku, qty });
  renderShop(); return { ok: true };
}
function setCartQty(sku, qty) {
  const line = cart.find(l => l.sku === sku);
  if (!line) return { ok: false, error: "购物车中没有该商品" };
  if (!isPosInt(qty)) return { ok: false, error: "数量必须是正整数" };
  qty = Number(qty);
  const fv = findVariant(sku);
  if (qty > fv.v.stock) return { ok: false, error: "超出库存（剩余 " + fv.v.stock + " 件）" };
  line.qty = qty; renderShop(); return { ok: true };
}
function removeFromCart(sku) { const n = cart.length; cart = cart.filter(l => l.sku !== sku); renderShop(); return { ok: cart.length < n }; }

// ---------- checkout ----------
function validateAddress(a) {
  const e = {};
  a = a || {};
  const name = String(a.name || "").trim(), phone = String(a.phone || "").trim(), address = String(a.address || "").trim();
  if (name.length < 2 || name.length > 20) e.name = "收货人需为 2–20 个字符";
  if (!/^1[3-9]\d{9}$/.test(phone)) e.phone = "请输入 11 位有效手机号";
  if (address.length < 5) e.address = "地址至少 5 个字符";
  return { errors: e, value: { name, phone, address } };
}
function createOrder(address) {
  if (!cart.length) return { ok: false, error: "购物车为空" };
  const { errors, value } = validateAddress(address);
  if (Object.keys(errors).length) return { ok: false, error: Object.values(errors).join("；") };
  for (const l of cart) { const fv = findVariant(l.sku); if (!fv || l.qty > fv.v.stock) return { ok: false, error: (fv ? fv.p.name + " " + fv.v.spec : l.sku) + " 库存不足" }; }
  const pr = priceCart(cart, isMember, couponCode);
  S.seq.order += 1;
  const d = new Date(), ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  const id = "TS" + ymd + String(S.seq.order).padStart(3, "0");
  const order = { id, createdAt: nowIso(), status: "pending", address: value, member: isMember,
    items: pr.lines.map(l => ({ sku: l.sku, name: l.name, spec: l.spec, qty: l.qty, unitPrice: l.unitPrice })),
    subtotal: pr.subtotal, discounts: pr.discounts, payable: pr.total, paidAt: null, shippedAt: null, cancelledAt: null, refunds: [] };
  for (const l of cart) findVariant(l.sku).v.stock -= l.qty;   // reserve stock
  S.orders.unshift(order);
  cart = []; couponCode = "";
  commit("下单", id + " 实付 " + fmt(order.payable) + "，已占用库存");
  return { ok: true, orderId: id };
}
function prepareCheckout(address) {
  if (!cart.length) return { ok: false, error: "购物车为空" };
  const { errors } = validateAddress(address);
  if (Object.keys(errors).length) return { ok: false, error: Object.values(errors).join("；") };
  pendingCheckout = { token: Math.random().toString(36).slice(2), address };
  openCheckoutDialog(address, true);
  return { ok: true };
}
function confirmPending() {
  if (!pendingCheckout || usedTokens.has(pendingCheckout.token)) return { ok: false, error: "该订单已提交，请勿重复点击" };
  usedTokens.add(pendingCheckout.token);
  const btn = document.getElementById("confirmOrder"); btn.disabled = true;
  const r = createOrder(pendingCheckout.address);
  pendingCheckout = null;
  return r;
}

// ---------- order status ----------
function getOrder(id) { return S.orders.find(o => o.id === id); }
function pay(id) {
  const o = getOrder(id); if (!o) return { ok: false, error: "订单不存在" };
  if (o.status !== "pending") return { ok: false, error: "只有待付款订单可以付款（当前：" + STATUS[o.status] + "）" };
  o.status = "paid"; o.paidAt = nowIso(); commit("模拟付款", id + " 收款 " + fmt(o.payable)); return { ok: true };
}
function ship(id) {
  const o = getOrder(id); if (!o) return { ok: false, error: "订单不存在" };
  if (o.status !== "paid") return { ok: false, error: "只有已付款订单可以发货（当前：" + STATUS[o.status] + "）" };
  o.status = "shipped"; o.shippedAt = nowIso(); commit("发货", id); return { ok: true };
}
function cancel(id) {
  const o = getOrder(id); if (!o) return { ok: false, error: "订单不存在" };
  if (o.status === "cancelled") return { ok: false, error: "订单已取消，不能重复取消" };
  if (o.status === "shipped") return { ok: false, error: "已发货订单不能取消，请走售后退货" };
  // release the stock of every unit that has not been released yet (unshipped refunds release immediately)
  for (const li of o.items) { const fv = findVariant(li.sku); const rest = li.qty - refundedQty(o, li.sku); if (fv && rest > 0) fv.v.stock += rest; }
  let detail = id + " 已释放库存";
  if (o.status === "paid") {
    const left = o.payable - refundedAmount(o);
    const items = o.items.map(li => ({ sku: li.sku, qty: li.qty - refundedQty(o, li.sku) })).filter(i => i.qty > 0);
    if (left > 0 || items.length) {
      S.seq.refund += 1;
      o.refunds.push({ id: "RF" + Date.now().toString().slice(-8) + String(S.seq.refund).padStart(3, "0"), createdAt: nowIso(), items, amount: left, returnGoods: false, restocked: true, restockedAt: nowIso(), auto: "取消订单自动退款" });
      detail += "，原路退回 " + fmt(left);
    }
  }
  o.status = "cancelled"; o.cancelledAt = nowIso(); commit("取消订单", detail); return { ok: true };
}

// ---------- after-sale ----------
function requestAfterSale(orderId, items, opts) {
  const o = getOrder(orderId); if (!o) return { ok: false, error: "订单不存在" };
  if (!["paid", "shipped"].includes(o.status)) return { ok: false, error: "只有已付款或已发货订单可以申请售后" };
  const returnGoods = o.status === "shipped" ? !(opts && opts.returnGoods === false) : false;
  const merged = {};
  for (const it of items || []) {
    if (!it || !isPosInt(it.qty)) return { ok: false, error: "售后数量必须是正整数" };
    merged[it.sku] = (merged[it.sku] || 0) + Number(it.qty);
  }
  const list = Object.entries(merged).map(([sku, qty]) => ({ sku, qty }));
  if (!list.length) return { ok: false, error: "请选择售后商品" };
  for (const it of list) {
    const li = o.items.find(x => x.sku === it.sku);
    if (!li) return { ok: false, error: "订单中没有 " + it.sku };
    const can = li.qty - refundedQty(o, it.sku);
    if (it.qty > can) return { ok: false, error: li.name + " " + li.spec + " 最多可退 " + can + " 件" };
  }
  const amount = allocRefund(o, list);
  if (amount <= 0 || refundedAmount(o) + amount > o.payable) return { ok: false, error: "累计退款不能超过实付金额" };
  S.seq.refund += 1;
  const id = "RF" + Date.now().toString().slice(-8) + String(S.seq.refund).padStart(3, "0");
  const unshipped = o.status === "paid";
  if (unshipped) for (const it of list) findVariant(it.sku).v.stock += it.qty; // goods never left: release now
  o.refunds.push({ id, createdAt: nowIso(), items: list, amount, returnGoods, restocked: unshipped, restockedAt: unshipped ? nowIso() : null });
  commit("售后退款", id + "（订单 " + orderId + "）退款 " + fmt(amount) + (returnGoods ? "，待退货入库" : unshipped ? "，未发货已释放库存" : "，仅退款不退货"));
  return { ok: true, refundId: id, amount: yuan(amount) };
}
function confirmReturn(refundId) {
  for (const o of S.orders) {
    const r = o.refunds.find(x => x.id === refundId);
    if (!r) continue;
    if (!r.returnGoods) return { ok: false, error: "该售后单无需退货入库" };
    if (r.restocked) return { ok: false, error: "该售后单已入库，不能重复入库" };
    for (const it of r.items) findVariant(it.sku).v.stock += it.qty;
    r.restocked = true; r.restockedAt = nowIso();
    commit("退货入库", refundId + " 回补库存 " + r.items.map(i => i.sku + "×" + i.qty).join("，"));
    return { ok: true };
  }
  return { ok: false, error: "售后单不存在" };
}

// ---------- stats & query ----------
function stats() {
  let sales = 0, refunds = 0; const units = {};
  for (const o of S.orders) {
    if (!o.paidAt) continue;
    sales += o.payable;
    for (const li of o.items) units[li.sku] = (units[li.sku] || 0) + li.qty;
    for (const r of o.refunds) { refunds += r.amount; for (const it of r.items) units[it.sku] = (units[it.sku] || 0) - it.qty; }
  }
  return { sales, refunds, net: sales - refunds, units };
}
function queryOrders(f) {
  f = f || {};
  return S.orders.filter(o => {
    if (f.orderId && !o.id.toLowerCase().includes(String(f.orderId).toLowerCase())) return false;
    if (f.status && o.status !== f.status) return false;
    if (f.sku) { const k = String(f.sku).toLowerCase(); if (!o.items.some(i => i.sku.toLowerCase().includes(k) || i.name.toLowerCase().includes(k))) return false; }
    if (f.from && o.createdAt < new Date(f.from).toISOString()) return false;
    if (f.to) { const t = new Date(f.to); if (String(f.to).length <= 10) t.setDate(t.getDate() + 1); if (o.createdAt >= t.toISOString()) return false; }
    return true;
  });
}

// ---------- backup ----------
function validate(d) {
  if (!d || typeof d !== "object") return "不是有效的数据对象";
  if (d.version !== 1) return "版本不匹配";
  if (!Array.isArray(d.products) || !d.products.length) return "缺少商品数据";
  const skus = new Set();
  for (const p of d.products) {
    if (!p || typeof p.id !== "string" || typeof p.name !== "string" || !Array.isArray(p.variants) || !p.variants.length) return "商品数据不完整";
    for (const v of p.variants) {
      if (!v || typeof v.sku !== "string" || !Number.isInteger(v.price) || v.price < 0 || !Number.isInteger(v.stock) || v.stock < 0) return "规格数据不完整：" + (v && v.sku);
      skus.add(v.sku);
    }
  }
  if (!Array.isArray(d.coupons) || !Array.isArray(d.orders) || !Array.isArray(d.logs) || typeof d.memberRate !== "number" || !d.seq) return "缺少订单 / 优惠 / 日志数据";
  for (const o of d.orders) {
    if (!o || typeof o.id !== "string" || !STATUS[o.status] || !Array.isArray(o.items) || !o.items.length || !Array.isArray(o.refunds) || !Number.isInteger(o.payable)) return "订单数据不完整：" + (o && o.id);
    for (const it of o.items) if (!skus.has(it.sku) || !Number.isInteger(it.qty) || it.qty <= 0) return "订单商品无效：" + o.id;
    if (o.refunds.reduce((s, r) => s + r.amount, 0) > o.payable) return "退款超过实付：" + o.id;
  }
  return null;
}
function exportData() { return JSON.stringify({ app: "toyshop-workbench", exportedAt: nowIso(), data: S }, null, 2); }
function importData(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: "文件不是有效的 JSON" }; }
  if (!obj || obj.app !== "toyshop-workbench" || !obj.data) return { ok: false, error: "不是本系统导出的备份文件" };
  const err = validate(obj.data);
  if (err) return { ok: false, error: "备份文件不完整：" + err };
  S = clone(obj.data); cart = []; couponCode = "";
  commit("导入备份", "导入 " + S.orders.length + " 个订单、" + S.products.length + " 个商品");
  return { ok: true };
}

function statusTag(o) {

  if (o.refunds.some(r => r.returnGoods && !r.restocked)) tags.push(`<span class="tag st-pending">待退货入库</span>`);
  return tags.join(" ");
}

  $("confirmSummary").innerHTML = `<p><b>${esc(a.name)}</b> ${esc(a.phone)}<br>${esc(a.address)}</p>
    <table>${pc.lines.map(l => `<tr><td>${esc(l.name)} · ${esc(l.spec)}</td><td>× ${l.qty}</td><td class="right money">${fmt(l.lineTotal)}</td></tr>`).join("")}</table>
    <div class="breakdown" style="margin-top:8px"><div><span>商品原价合计</span><span>${fmt(pc.subtotal)}</span></div>${pc.discounts.map(d => `<div><span>− ${esc(d.label)}</span><span>−${fmt(d.amount)}</span></div>`).join("")}<div class="total"><span>应付金额</span><span>${fmt(pc.total)}</span></div></div>`;
  $("confirmOrder").disabled = false;
}
let refundCtx = null;
function openRefund(orderId) {
  const o = getOrder(orderId); refundCtx = o;
  $("rfOrderId").textContent = o.id;
  $("rfReturn").checked = o.status === "shipped"; $("rfReturn").disabled = o.status !== "shipped";
  $("rfBody").innerHTML = `<table><tr><th>商品</th><th>单价</th><th>可退</th><th>本次数量</th></tr>${o.items.map(li => {
    const can = li.qty - refundedQty(o, li.sku);
    return `<tr><td>${esc(li.name)} · ${esc(li.spec)}</td><td>${fmt(li.unitPrice)}</td><td>${can}</td><td><input type="number" min="0" max="${can}" step="1" value="0" style="width:60px" data-rfq="${li.sku}" ${can ? "" : "disabled"}></td></tr>`;
  }).join("")}</table>`;
  $("rfErr").textContent = ""; previewRefund(); $("refundDlg").showModal();
}
function refundItemsFromForm() { return [...document.querySelectorAll("[data-rfq]")].map(i => ({ sku: i.dataset.rfq, raw: i.value })).filter(i => i.raw !== "" && i.raw !== "0"); }
function previewRefund() {
  const o = refundCtx; const items = refundItemsFromForm();
  let err = "";
  for (const it of items) { const li = o.items.find(x => x.sku === it.sku); const can = li.qty - refundedQty(o, it.sku); if (!isPosInt(it.raw)) err = "数量必须是正整数"; else if (Number(it.raw) > can) err = li.name + " 最多可退 " + can + " 件"; }
  $("rfErr").textContent = err;
  const amt = !err && items.length ? allocRefund(o, items.map(i => ({ sku: i.sku, qty: Number(i.raw) }))) : 0;
  $("rfPreview").innerHTML = `<div><span>订单实付</span><span>${fmt(o.payable)}</span></div><div><span>已退款</span><span>${fmt(refundedAmount(o))}</span></div>
    <div class="small muted"><span>本次退款 = 退货数量 × 单价 × 实付 / 原价合计（按金额比例分摊优惠），四舍五入到分；退完最后一件时退回剩余实付</span><span></span></div>
    <div class="total"><span>本次退款</span><span>${fmt(amt)}</span></div>`;
  $("rfSubmit").disabled = !!err || !items.length;
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close]"); if (!t) return;
  if (t.matches("nav button")) { document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b === t)); document.querySelectorAll(".tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + t.dataset.tab)); return; }
  if (t.hasAttribute("data-close")) { t.closest("dialog").close(); return; }
  if (t.dataset.add) { const v = document.querySelector(`[data-qty="${CSS.escape(t.dataset.add)}"]`).value; report(addToCart(t.dataset.add, v), "已加入购物车"); return; }
  if (t.dataset.remove) { if (confirm("确定从购物车移除该商品？")) removeFromCart(t.dataset.remove); return; }
  if (t.dataset.pay) { if (confirm("确认已线下收款（模拟付款）？")) report(pay(t.dataset.pay), "付款成功"); return; }
  if (t.dataset.ship) { if (confirm("确认该订单已发货？发货后不能取消。")) report(ship(t.dataset.ship), "已发货"); return; }
  if (t.dataset.cancel) { const o = getOrder(t.dataset.cancel); if (confirm("确定取消订单 " + o.id + "？" + (o.status === "paid" ? "将原路退回实付剩余金额并释放库存。" : "将释放占用的库存。") + "此操作不可撤销。")) report(cancel(t.dataset.cancel), "订单已取消"); return; }
  if (t.dataset.refund) { openRefund(t.dataset.refund); return; }
  if (t.dataset.restock) { if (confirm("确认已收到退货并入库？库存将回补，且只能入库一次。")) report(confirmReturn(t.dataset.restock), "已入库"); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.setqty) { const r = setCartQty(t.dataset.setqty, t.value); if (!r.ok) { toast(r.error, "err"); renderShop(); } }
  if (t.id === "couponSel") { couponCode = t.value; renderShop(); }
  if (t.id === "memberToggle") { isMember = t.checked; renderShop(); toast(isMember ? "已切换为会员价，优惠已重新计算" : "已切换为非会员，优惠已重新计算", "info"); }
  if (["fCat", "fStock", "fPrice"].includes(t.id)) renderShop();
  if (["ost", "ofrom", "oto"].includes(t.id)) renderOrders();
  if (t.dataset.rfq !== undefined) previewRefund();
  if (t.id === "importFile" && t.files[0]) {
    const f = t.files[0]; const rd = new FileReader();
    rd.onload = () => { if (confirm("导入将用备份文件替换当前全部数据，确定继续？")) report(importData(String(rd.result)), "导入成功"); t.value = ""; };
    rd.readAsText(f);
  }
});
document.addEventListener("input", e => { if (["q"].includes(e.target.id)) renderShop(); if (["oq", "osku"].includes(e.target.id)) renderOrders(); if (e.target.dataset.rfq !== undefined) previewRefund(); });
$("toCheckout").onclick = () => { pendingCheckout = null; openCheckoutDialog(null, false); };
$("toConfirm").onclick = () => {
  const a = { name: $("addrName").value, phone: $("addrPhone").value, address: $("addrAddr").value };
  const { errors } = validateAddress(a);
  $("eName").textContent = errors.name || ""; $("ePhone").textContent = errors.phone || ""; $("eAddr").textContent = errors.address || "";
  if (Object.keys(errors).length) return;
  prepareCheckout(a);
};
$("backToStep1").onclick = () => { pendingCheckout = null; openCheckoutDialog(null, false); };
$("confirmOrder").onclick = () => { const r = confirmPending(); if (r.ok) { $("checkoutDlg").close(); toast("下单成功：" + r.orderId + "（待付款）", "ok"); } else toast(r.error, "err"); };
$("rfSubmit").onclick = () => {
  const items = refundItemsFromForm().map(i => ({ sku: i.sku, qty: i.raw }));
  if (!confirm("确认提交售后并退款？退款金额将记录为已退出。")) return;
  const r = requestAfterSale(refundCtx.id, items, { returnGoods: $("rfReturn").checked });
  if (r.ok) { $("refundDlg").close(); toast("售后已提交，退款 ¥" + r.amount.toFixed(2), "ok"); } else $("rfErr").textContent = r.error;
};
$("btnExport").onclick = () => { const blob = new Blob([exportData()], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "toyshop-backup-" + new Date().toISOString().slice(0, 10) + ".json"; a.click(); URL.revokeObjectURL(a.href); log("导出备份", "导出完整业务数据"); persist(); renderLogs(); };
$("btnReset").onclick = () => { if (confirm("恢复演示初始数据会清空当前所有订单和记录，确定？")) { S = seed(); cart = []; couponCode = ""; commit(); toast("已恢复初始数据", "ok"); } };
$("oclear").onclick = () => { ["oq", "osku", "ost", "ofrom", "oto"].forEach(id => $(id).value = ""); renderOrders(); };

// ---------- test hook (yuan in / out) ----------
const outOrder = o => ({ id: o.id, status: o.status, createdAt: o.createdAt, paidAt: o.paidAt, shippedAt: o.shippedAt, cancelledAt: o.cancelledAt, address: clone(o.address),
  items: o.items.map(i => ({ sku: i.sku, name: i.name, spec: i.spec, qty: i.qty, unitPrice: yuan(i.unitPrice) })),
  subtotal: yuan(o.subtotal), discounts: o.discounts.map(d => ({ type: d.type, label: d.label, amount: yuan(d.amount) })), payable: yuan(o.payable),
  refundedAmount: yuan(refundedAmount(o)),
  refunds: o.refunds.map(r => ({ id: r.id, items: clone(r.items), amount: yuan(r.amount), returnGoods: r.returnGoods, restocked: r.restocked })) });
window.shopTestAPI = {
  reset() { S = seed(); cart = []; couponCode = ""; isMember = false; pendingCheckout = null; commit(); return { ok: true }; },
  getState() {
    return { products: S.products.map(p => ({ id: p.id, name: p.name, category: p.category, variants: p.variants.map(v => ({ sku: v.sku, spec: v.spec, price: yuan(v.price), stock: v.stock })) })),
      coupons: S.coupons.map(c => ({ code: c.code, threshold: yuan(c.threshold), amount: yuan(c.amount) })),
      isMember, orders: S.orders.map(outOrder), logs: clone(S.logs) };
  },
  setMember(flag) { isMember = !!flag; renderAll(); return { ok: true }; },
  addToCart, setCartQty, removeFromCart,
  applyCoupon(code) {
    if (!code) { couponCode = ""; renderShop(); return { ok: true }; }
    const c = S.coupons.find(x => x.code === code); if (!c) return { ok: false, error: "优惠券不存在" };
    const pc = priceCart(cart, isMember, code); if (pc.couponStatus !== "ok") return { ok: false, error: pc.couponStatus };
    couponCode = code; renderShop(); return { ok: true };
  },
  getCart() {
    const pc = priceCart(cart, isMember, couponCode);
    if (couponCode && pc.couponStatus !== "ok") couponCode = "";
    return { lines: pc.lines.map(l => ({ sku: l.sku, qty: l.qty, unitPrice: yuan(l.unitPrice), lineTotal: yuan(l.lineTotal) })), subtotal: yuan(pc.subtotal),
      discounts: pc.discounts.map(d => ({ type: d.type, label: d.label, amount: yuan(d.amount) })), total: yuan(pc.total), coupon: couponCode || null };
  },
  prepareCheckout, checkout: createOrder, pay, ship, cancel,
  requestAfterSale, confirmReturn,
  queryOrders(f) { return queryOrders(f).map(outOrder); },
  getStats() { const s = stats(); return { sales: yuan(s.sales), refunds: yuan(s.refunds), net: yuan(s.net), unitsSold: Object.fromEntries(Object.entries(s.units).map(([k, v]) => [k, v])) }; },
  exportData, importData,
};
renderAll();
})();
</script>
